name: Deploy Production (Cloudflare & GitHub Pages)
# Trigger CI/CD verification run

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # --- 1. Cloudflare Workers Production Deployment (daemonx.in) ---
      - name: Build for Cloudflare (Root Path)
        env:
          VITE_BASE_PATH: "/"
        run: npm run build

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: '4.168.0'
          command: deploy

      # --- 2. GitHub Pages Deployment (Subfolder /DaemonMiniapp/ Path) ---
      - name: Build for GitHub Pages (Subfolder Path)
        run: npm run build

      - name: Copy 404.html and .nojekyll for GitHub Pages
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Deploy to gh-pages Branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
