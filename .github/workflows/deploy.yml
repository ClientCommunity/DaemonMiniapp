name: Deploy Production (VPS & GitHub Pages)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # --- 1. VPS Production Deployment (Root Base Path /) ---
      - name: Build for VPS (Root Path)
        env:
          VITE_BASE_PATH: "/"
        run: npm run build

      - name: Deploy to VPS via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          source: "dist/*"
          target: "/var/www/html"
          strip_components: 1

      - name: Configure VPS Symlinks & 404 Fallback
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            cp /var/www/html/index.html /var/www/html/404.html
            ln -sfn /var/www/html /var/www/html/DaemonMiniapp

      # --- 2. GitHub Pages Deployment (Subfolder /DaemonMiniapp/ Path) ---
      - name: Build for GitHub Pages (Subfolder Path)
        run: npm run build

      - name: Copy 404.html and .nojekyll for GitHub Pages
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Deploy to gh-pages Branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
